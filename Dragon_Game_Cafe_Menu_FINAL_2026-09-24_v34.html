<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>کافه گیم دراگون | منوی دیجیتال | V34</title>
<style>html,body{margin:0;background:#050b1b;color:#fff;font-family:system-ui,sans-serif}#loader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.loader-card{padding:28px;border:1px solid rgba(112,239,255,.25);border-radius:24px;background:rgba(10,24,52,.72);backdrop-filter:blur(16px)}.loader-card strong{display:block;font-size:20px}.loader-card span{display:block;margin-top:8px;color:#9fb3d9;font-size:12px}</style>
</head>
<body>
<div id="loader"><div class="loader-card"><strong>کافه گیم دراگون</strong><span>در حال بارگذاری منوی دیجیتال V34…</span></div></div>
<script>
(async()=>{
 try{
  const base='./release/v6/';
  const names=Array.from({length:11},(_,i)=>`chunk${String(i+1).padStart(2,'0')}.part`);
  const parts=await Promise.all(names.map(n=>fetch(base+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text();})));
  let html=parts.join('');
  const versions=[7,32,33,34];
  const patches=await Promise.all(versions.map(async v=>({v,css:await fetch(`./release/v${v}/patch.css`,{cache:'no-store'}).then(r=>r.text()),js:await fetch(`./release/v${v}/patch.js`,{cache:'no-store'}).then(r=>r.text())})));
  html=html.replace('</head>',patches.map(p=>`<style id="dragon-v${p.v}-external-patch">${p.css}</style>`).join('')+'</head>');
  html=html.replace('</body>',patches.map(p=>`<script>${p.js}<\\/script>`).join('')+'</body>');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('loader').innerHTML='<div class="loader-card"><strong>کافه گیم دراگون</strong><span>بارگذاری منو انجام نشد. اتصال به GitHub Pages را بررسی کنید.</span></div>';console.error(e)}
})();
</script>
</body>
</html>
