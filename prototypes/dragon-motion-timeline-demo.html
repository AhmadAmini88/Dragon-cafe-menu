<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Motion Demo</title><style>
:root{--b:#39adff;--c:#61e6ff;--bg:#071a35;--glass:rgba(255,255,255,.08);--bd:rgba(142,218,255,.22);--txt:#eff8ff;--mut:#a9c5df}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--txt);background:radial-gradient(circle at 80% 0,#114c84 0,transparent 42%),radial-gradient(circle at 10% 100%,#173a9a 0,transparent 38%),var(--bg);display:grid;place-items:center;padding:20px}.glass{width:min(720px,100%);padding:22px;border:1px solid var(--bd);border-radius:28px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:0 28px 70px rgba(0,0,0,.35)}h1{font-size:22px;margin:0 0 6px}.mut{color:var(--mut);font-size:12px}.btn{margin-top:14px;padding:11px 15px;border-radius:14px;border:1px solid var(--bd);background:linear-gradient(135deg,#1c83df,#43cfff);color:white;font-weight:800;cursor:pointer;transition:.2s}.btn:active{transform:scale(.95)}.timeline{position:relative;margin:28px 0 6px;padding-right:24px}.timeline:before{content:"";position:absolute;right:10px;top:12px;bottom:12px;width:3px;border-radius:9px;background:linear-gradient(var(--b),rgba(97,230,255,.1))}.step{position:relative;display:grid;grid-template-columns:34px 1fr;gap:10px;margin-bottom:17px}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(30,90,160,.3);border:1px solid var(--bd);z-index:1}.step.active .dot{background:linear-gradient(145deg,#1685e8,#60ddff);animation:pulse 1.7s infinite}.step.done .dot{background:linear-gradient(145deg,#146fc2,#46c6ef)}.title{font-weight:900;font-size:13px}.sub{font-size:10px;color:var(--mut);margin-top:3px}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(57,173,255,0),0 0 28px rgba(57,173,255,.32)}}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.card{padding:15px;border:1px solid var(--bd);border-radius:20px;background:rgba(255,255,255,.05);transition:.3s;position:relative;overflow:hidden}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 62%);transform:translateX(-140%);transition:.7s}.card:hover{transform:translateY(-4px)}.card:hover:after{transform:translateX(140%)}@media(max-width:600px){.cards{grid-template-columns:1fr}.glass{padding:16px}}
</style><main class="glass"><h1>Dragon Game Café — Motion System</h1><div class="mut">دموی اکشن‌های لمسی، کارت‌های شیشه‌ای و Timeline سفارش</div><button class="btn" id="next">مرحله بعد سفارش</button><div class="timeline" id="timeline"></div><div class="cards"><div class="card"><b>✨ Card Entrance</b><div class="mut">ورود نرم محصولات</div></div><div class="card"><b>🛒 Add Action</b><div class="mut">پاسخ سریع به لمس</div></div><div class="card"><b>🔔 New Order</b><div class="mut">برجسته‌سازی سفارش جدید</div></div></div></main><script>const steps=[['سفارش ثبت شد','سفارش برای کافه ارسال شد'],['تأیید شد','کافه سفارش را پذیرفت'],['در حال آماده‌سازی','آشپزخانه در حال آماده کردن سفارش است'],['آماده تحویل','سفارش آماده تحویل است'],['تحویل شد','نوش جان!']];let n=2;function draw(){timeline.innerHTML=steps.map((s,i)=>`<div class="step ${i<n?'done':''} ${i===n-1?'active':''}"><div class="dot">${i<n-1?'✓':i===n-1?'•':'○'}</div><div><div class="title">${s[0]}</div><div class="sub">${s[1]}</div></div></div>`).join('')}next.onclick=()=>{n=Math.min(5,n+1);draw()};draw()</script></html>
