<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1597e5">
    <link rel="manifest" href="manifest.webmanifest">
    <script>
      (function(){
        try{
          var p=new URLSearchParams(location.search);
          if(p.get("admin")==="true"||p.get("admin")==="1"||location.hash==="#admin"){
            document.documentElement.classList.add("admin-preboot");
          }
        }catch(e){}
      })();
    </script>
    <title>منوی دیجیتال | DRAGON CAFE</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root{--blue:#4fb3ff;--indigo:#7c6cff;--cyan:#57e0e0;--gold:#ffd166;--danger:#ff6b81;--text:#f3f7ff;--text-dim:#9fb3d9;--glass:rgba(255,255,255,.06);--glass-strong:rgba(255,255,255,.10);--border:rgba(255,255,255,.12);--shadow:0 20px 40px rgba(0,0,0,.5);--radius:24px;--sidebar-w:76px;--transition:.25s cubic-bezier(.4,0,.2,1)}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html{background:#060b1a;scroll-behavior:smooth}body{direction:rtl;font-family:Vazirmatn,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse 80% 60% at 80% 10%,rgba(79,179,255,.2),transparent 60%),radial-gradient(ellipse 80% 60% at 20% 90%,rgba(124,108,255,.15),transparent 60%),radial-gradient(circle at 50% 50%,rgba(87,224,224,.05),transparent 40%),#060b1a;position:relative}
        body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.15),transparent),radial-gradient(2px 2px at 40% 70%,rgba(255,255,255,.1),transparent),radial-gradient(2px 2px at 60% 20%,rgba(255,255,255,.12),transparent),radial-gradient(2px 2px at 80% 80%,rgba(255,255,255,.08),transparent),radial-gradient(3px 3px at 10% 90%,rgba(79,179,255,.15),transparent),radial-gradient(3px 3px at 90% 10%,rgba(124,108,255,.12),transparent);background-size:200px 200px;pointer-events:none;z-index:0;animation:twinkle 8s infinite alternate}@keyframes twinkle{0%{opacity:.5}100%{opacity:1}}
        button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--blue);border-radius:8px}
        .sidebar{position:fixed;top:0;bottom:0;right:0;width:var(--sidebar-w);background:rgba(10,16,34,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--border);overflow-y:auto;z-index:40;scrollbar-width:none;padding:12px 0 100px;display:flex;flex-direction:column;align-items:center;gap:4px}.sidebar::-webkit-scrollbar{display:none}
        .cat-btn{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;color:var(--text-dim);transition:var(--transition)}.cat-btn::after{content:"";position:absolute;bottom:2px;right:50%;transform:translateX(50%);width:0;height:2px;border-radius:2px;background:var(--blue);transition:var(--transition)}.cat-btn.active::after{width:24px}.cat-btn .ic{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--border);font-size:22px;transition:var(--transition)}.cat-btn.active .ic{background:rgba(79,179,255,.18);border-color:rgba(79,179,255,.6);box-shadow:0 0 24px rgba(79,179,255,.3)}.cat-btn .lb{font-size:10px;font-weight:700;letter-spacing:.3px}.cat-btn.active .lb{color:var(--blue)}
        .main{margin-right:var(--sidebar-w);min-height:100vh;position:relative;padding-bottom:20px}.toolbar{position:sticky;top:12px;z-index:30;margin:12px 12px 0;display:flex;align-items:center;justify-content:space-between;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:999px;padding:6px 10px 6px 6px;gap:6px;box-shadow:0 8px 32px rgba(0,0,0,.3);max-width:100%}.toolbar .icons{display:flex;align-items:center;gap:4px;flex-shrink:0}.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--border);font-size:17px;transition:var(--transition);position:relative;flex-shrink:0}
        .brand-pill{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:4px 16px 4px 8px;flex-shrink:1;min-width:0;margin-right:auto;max-width:100%;overflow:hidden}.brand-pill .logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,rgba(79,179,255,.3),rgba(124,108,255,.3));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;color:#4fb3ff;border:1px solid rgba(79,179,255,.4);box-shadow:0 0 20px rgba(79,179,255,.2)}.brand-pill .brand-text{font-size:15px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#4fb3ff,#7c6cff,#57e0e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
        .search-row{padding:12px 16px 0;display:none}.search-row.show{display:block;animation:fadeIn .2s ease}.search-row input{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-family:inherit;font-size:14px;backdrop-filter:blur(8px);transition:var(--transition)}.search-row input::placeholder{color:var(--text-dim)}.search-row input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,179,255,.2)}
        .cat-heading{padding:24px 20px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cat-heading .em{font-size:26px}.cat-heading h1{font-size:20px;font-weight:800;white-space:nowrap}.cat-heading .dash{flex:0 0 32px;height:2px;background:linear-gradient(90deg,var(--blue),transparent);border-radius:2px}.cat-heading .sub{font-size:11px;color:var(--text-dim);margin-right:auto;white-space:nowrap;font-weight:600}
        .items{padding:16px 16px 120px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;align-items:stretch}.cat-featured .items{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}.item-card{position:relative;height:100%;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .3s ease;display:flex;flex-direction:column}.item-card:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(0,85,170,.26),0 0 0 1px rgba(79,179,255,.18)}.item-card.soldout{opacity:.6;filter:grayscale(.3)}.item-card .img-wrap{position:relative;overflow:hidden;background:#0a1022;flex-shrink:0;aspect-ratio:4/3;min-height:185px}.item-card .img-wrap img{transition:transform .4s ease}.item-card:hover .img-wrap img{transform:scale(1.04)}.item-body{padding:14px 16px 16px;text-align:right;flex:1;display:flex;flex-direction:column}.item-name{font-size:17px;font-weight:800}.item-desc{font-size:13px;color:var(--text-dim);margin-top:6px;line-height:1.75;flex:1}.item-foot{margin-top:14px;display:flex;align-items:center;justify-content:space-between}
        .add-btn{position:relative;overflow:hidden}.add-btn::after{content:"";position:absolute;inset:-20% -80%;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.34) 48%,transparent 62%);transform:translateX(-70%);transition:.45s}.add-btn:hover::after{transform:translateX(70%)}.pulse-new{animation:orderPulse 1.4s ease-in-out 2}@keyframes orderPulse{0%,100%{box-shadow:0 0 0 0 rgba(79,179,255,0)}50%{box-shadow:0 0 0 8px rgba(79,179,255,.14)}}
        .network-status{position:fixed;left:12px;bottom:82px;z-index:55;padding:7px 12px;border-radius:999px;background:rgba(10,35,65,.78);border:1px solid rgba(144,202,255,.22);backdrop-filter:blur(14px);font-size:10px;font-weight:800;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}.network-status.show{opacity:1;transform:none}.network-status.offline{border-color:rgba(255,107,129,.38);color:#ffd6dc}.network-status.online{border-color:rgba(87,224,224,.35);color:#cfffff}
        html.admin-preboot #welcomePopup,html.admin-preboot .sidebar,html.admin-preboot .main,html.admin-preboot .bottom-bar,html.admin-preboot .fab-add{visibility:hidden!important}html.admin-preboot #adminGate{display:flex!important;opacity:1!important;visibility:visible!important}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
        @media (max-width:520px){:root{--sidebar-w:72px}.items{padding:12px 10px 110px;grid-template-columns:1fr!important;gap:14px}.item-card .img-wrap{min-height:220px}.item-name{font-size:16px}.item-desc{font-size:12px}.cat-heading{padding:18px 12px 6px}.cat-heading h1{font-size:18px}.toolbar{margin:8px 8px 0}.brand-pill .brand-text{font-size:13px}}
        @media (min-width:521px) and (max-width:900px){.items{grid-template-columns:repeat(2,minmax(0,1fr))!important}.item-card .img-wrap{min-height:210px}}@media (min-width:1100px){.item-card .img-wrap{min-height:240px}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
    </style>
</head>
<body>
